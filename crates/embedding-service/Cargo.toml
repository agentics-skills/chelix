[package]
description       = "Managed local embedding sidecar for Chelix"
edition.workspace = true
name              = "chelix-embedding-service"
version.workspace = true

[[bin]]
name              = "chelix-embedding-service"
path              = "src/main.rs"
required-features = ["native-engine"]

[features]
default       = ["metrics", "native-engine", "tracing"]
metrics       = ["dep:metrics"]
native-engine = ["dep:mistralrs"]
tracing       = ["dep:tracing", "dep:tracing-subscriber"]

[dependencies]
anyhow             = { workspace = true }
async-trait        = { workspace = true }
axum               = { workspace = true }
chelix-protocol    = { workspace = true }
clap               = { workspace = true }
either             = { workspace = true }
fd-lock            = { workspace = true }
metrics            = { optional = true, workspace = true }
mistralrs          = { optional = true, workspace = true }
serde              = { workspace = true }
serde_json         = { workspace = true }
sha2               = { workspace = true }
tokio              = { workspace = true }
tower              = { features = ["limit", "load-shed"], workspace = true }
tracing            = { optional = true, workspace = true }
tracing-subscriber = { optional = true, workspace = true }

[dev-dependencies]
reqwest  = { workspace = true }
tempfile = { workspace = true }

[lints]
workspace = true
