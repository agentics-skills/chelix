[package]
description          = "GitHub API tool set for Chelix"
edition.workspace    = true
name                 = "chelix-github"
repository.workspace = true
version.workspace    = true

[dependencies]
anyhow         = { workspace = true }
async-trait    = { workspace = true }
base64         = { workspace = true }
chelix-agents  = { workspace = true }
chelix-common  = { workspace = true }
chelix-config  = { workspace = true }
chelix-metrics = { optional = true, workspace = true }
reqwest        = { workspace = true }
secrecy        = { workspace = true }
serde          = { workspace = true }
serde_json     = { workspace = true }
thiserror      = { workspace = true }
time           = { workspace = true }
tokio          = { workspace = true }
tracing        = { workspace = true }
url            = { workspace = true }

[dev-dependencies]
mockito = { workspace = true }
tokio   = { features = ["macros", "rt-multi-thread"], workspace = true }

[features]
default = ["tracing"]
metrics = ["dep:chelix-metrics"]
tracing = []

[lints]
workspace = true
