[package]
edition.workspace = true
name              = "chelix-agents"
version.workspace = true

[features]
default   = ["metrics"]
metrics   = ["dep:chelix-metrics"]
test-util = ["dep:tempfile"]

[dependencies]
anyhow                = { workspace = true }
async-trait           = { workspace = true }
chelix-common         = { workspace = true }
chelix-config         = { workspace = true }
chelix-config-service = { workspace = true }
chelix-service-traits = { workspace = true }
chelix-sessions       = { workspace = true }
chelix-skills         = { workspace = true }
futures               = { workspace = true }
include_dir           = { workspace = true }
secrecy               = { workspace = true }
serde                 = { workspace = true }
serde_json            = { workspace = true }
thiserror             = { workspace = true }
time                  = { features = ["macros"], workspace = true }
tokio                 = { workspace = true }
tokio-stream          = { workspace = true }
tokio-util            = { workspace = true }
tracing               = { workspace = true }
uuid                  = { workspace = true }

# Optional
chelix-metrics = { optional = true, workspace = true }
tempfile       = { optional = true, workspace = true }

[dev-dependencies]
tempfile = { workspace = true }

[lints]
workspace = true
