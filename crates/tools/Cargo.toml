[package]
edition.workspace = true
name              = "chelix-tools"
version.workspace = true

[features]
bundled-skills        = ["chelix-skills/bundled-skills"]
default               = ["firecrawl", "metrics"]
firecrawl             = []
metrics               = ["dep:chelix-metrics"]

[dependencies]
anyhow                = { workspace = true }
async-trait           = { workspace = true }
base64                = { workspace = true }
chelix-agents         = { workspace = true }
chelix-browser        = { workspace = true }
chelix-common         = { workspace = true }
chelix-config         = { workspace = true }
chelix-cron           = { workspace = true }
chelix-metrics        = { optional = true, workspace = true }
chelix-protocol       = { workspace = true }
chelix-providers      = { workspace = true }
chelix-service-traits = { workspace = true }
chelix-sessions       = { workspace = true }
chelix-skills         = { workspace = true }
futures               = { workspace = true }
image                 = { workspace = true }
reqwest               = { workspace = true }
secrecy               = { workspace = true }
serde                 = { workspace = true }
serde_json            = { workspace = true }
sha2                  = { workspace = true }
thiserror             = { workspace = true }
time                  = { workspace = true }
tokio                 = { workspace = true }
tokio-tungstenite     = { workspace = true }
tracing               = { workspace = true }
url                   = { workspace = true }
uuid                  = { workspace = true }
which                 = { workspace = true }

[dev-dependencies]
mockito      = { workspace = true }
sqlx         = { workspace = true }
tempfile     = { workspace = true }
tokio        = { features = ["macros", "rt-multi-thread"], workspace = true }
tokio-stream = { workspace = true }

[lints]
workspace = true
