[package]
edition.workspace    = true
name                 = "chelix-tls"
repository.workspace = true
version.workspace    = true

[dependencies]
axum           = { optional = true, workspace = true }
chelix-common  = { optional = true, workspace = true }
chelix-config  = { workspace = true }
hostname       = { optional = true, workspace = true }
hyper-util     = { optional = true, workspace = true }
rcgen          = { optional = true, workspace = true }
rustls         = { optional = true, workspace = true }
rustls-pemfile = { optional = true, workspace = true }
thiserror      = { optional = true, workspace = true }
time           = { optional = true, workspace = true }
tokio          = { optional = true, workspace = true }
tokio-rustls   = { optional = true, workspace = true }
tower          = { optional = true, workspace = true }
tracing        = { optional = true, workspace = true }

[features]
default = ["runtime"]
runtime = [
  "dep:axum",
  "dep:chelix-common",
  "dep:hostname",
  "dep:hyper-util",
  "dep:rcgen",
  "dep:rustls",
  "dep:rustls-pemfile",
  "dep:thiserror",
  "dep:time",
  "dep:tokio",
  "dep:tokio-rustls",
  "dep:tower",
  "dep:tracing",
]

[dev-dependencies]
tempfile = { workspace = true }

[lints]
workspace = true
