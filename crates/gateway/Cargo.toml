[package]
edition.workspace    = true
name                 = "chelix-gateway"
repository.workspace = true
version.workspace    = true

[dependencies]
anyhow                  = { workspace = true }
async-trait             = { workspace = true }
base64                  = { workspace = true }
bytes                   = { workspace = true }
chelix-agents           = { workspace = true }
chelix-auth             = { workspace = true }
chelix-channels         = { workspace = true }
chelix-chat             = { workspace = true }
chelix-code-index       = { workspace = true }
chelix-common           = { workspace = true }
chelix-config           = { workspace = true }
chelix-config-service   = { workspace = true }
chelix-context7         = { workspace = true }
chelix-cron             = { workspace = true }
chelix-duckduckgo       = { workspace = true }
chelix-exa              = { workspace = true }
chelix-felo             = { workspace = true }
chelix-github           = { workspace = true }
chelix-google           = { workspace = true }
chelix-linkup           = { workspace = true }
chelix-mcp              = { workspace = true }
chelix-mcp-agent-bridge = { workspace = true }
chelix-media            = { workspace = true }
chelix-memory           = { workspace = true }
chelix-metrics          = { optional = true, workspace = true }
chelix-onboarding       = { workspace = true }
chelix-plugins          = { workspace = true }
chelix-projects         = { workspace = true }
chelix-protocol         = { workspace = true }
chelix-provider-setup   = { workspace = true }
chelix-providers        = { workspace = true }
chelix-secret-store     = { workspace = true }
chelix-service-traits   = { workspace = true }
chelix-sessions         = { workspace = true }
chelix-skills           = { workspace = true }
chelix-telegram         = { optional = true, workspace = true }
chelix-telephony        = { optional = true, workspace = true }
chelix-tls              = { workspace = true }
chelix-tools            = { workspace = true }
chelix-vault            = { optional = true, workspace = true }
chelix-voice            = { workspace = true }
chelix-webhooks         = { workspace = true }
chrono                  = { features = ["serde"], optional = true, workspace = true }
flate2                  = { workspace = true }
futures                 = { workspace = true }
hostname                = { workspace = true }
mdns-sd                 = { optional = true, workspace = true }
p256                    = { features = ["ecdsa"], optional = true, workspace = true }
pulldown-cmark          = { features = ["html"], workspace = true }
rand                    = { workspace = true }
reqwest                 = { workspace = true }
secrecy                 = { workspace = true }
serde                   = { workspace = true }
serde_json              = { workspace = true }
sha2                    = { workspace = true }
sqlx                    = { workspace = true }
sysinfo                 = { workspace = true }
tar                     = { workspace = true }
tempfile                = { workspace = true }
thiserror               = { workspace = true }
time                    = { workspace = true }
tokio                   = { workspace = true }
tokio-util              = { workspace = true }
toml                    = { workspace = true }
toml_edit               = { workspace = true }
tracing                 = { workspace = true }
tracing-subscriber      = { workspace = true }
url                     = { workspace = true }
uuid                    = { workspace = true }
web-push                = { optional = true, workspace = true }
webauthn-rs             = { features = ["danger-allow-state-serialisation"], workspace = true }

[features]
agent = []
bundled-skills = [
  "chelix-chat/bundled-skills",
  "chelix-skills/bundled-skills",
  "chelix-tools/bundled-skills",
]
code-index-builtin = ["chelix-code-index/builtin"]
context7 = ["chelix-context7/runtime", "chelix-context7/tracing"]
default = [
  "agent",
  "bundled-skills",
  "code-index-builtin",
  "context7",
  "duckduckgo",
  "exa",
  "felo",
  "file-watcher",
  "firecrawl",
  "github",
  "google",
  "linkup",
  "mdns",
  "metrics",
  "prometheus",
  "push-notifications",
  "telegram",
  "telephony",
  "tls",
  "vault",
  "voice",
  "web-ui",
]
duckduckgo = ["chelix-duckduckgo/runtime", "chelix-duckduckgo/tracing"]
exa = ["chelix-exa/runtime", "chelix-exa/tracing"]
felo = ["chelix-felo/runtime", "chelix-felo/tracing"]
file-watcher = [
  "chelix-code-index/file-watcher",
  "chelix-memory/file-watcher",
  "chelix-skills/file-watcher",
]
firecrawl = ["chelix-tools/firecrawl"]
github = ["chelix-github/runtime", "chelix-github/tracing"]
google = ["chelix-google/runtime", "chelix-google/tracing"]
linkup = ["chelix-linkup/runtime", "chelix-linkup/tracing"]
mdns = ["dep:mdns-sd"]
metrics = [
  "chelix-chat/metrics",
  "chelix-config-service/metrics",
  "chelix-context7/metrics",
  "chelix-duckduckgo/metrics",
  "chelix-exa/metrics",
  "chelix-felo/metrics",
  "chelix-github/metrics",
  "chelix-google/metrics",
  "chelix-linkup/metrics",
  "chelix-metrics/sqlite",
  "dep:chelix-metrics",
]
prometheus = ["chelix-metrics/prometheus", "metrics"]
push-notifications = ["chelix-chat/push-notifications", "dep:chrono", "dep:p256", "dep:web-push"]
telegram = ["chelix-chat/telegram", "dep:chelix-telegram"]
telephony = ["dep:chelix-telephony"]
tls = ["chelix-tls/runtime"]
vault = ["chelix-auth/vault", "chelix-secret-store/vault", "dep:chelix-vault"]
voice = ["chelix-voice/runtime"]
web-ui = ["chelix-chat/web-ui"]

[dev-dependencies]
chelix-tools = { features = ["test-util"], workspace = true }
serial_test  = { workspace = true }
tokio-stream = { workspace = true }

[lints]
workspace = true
