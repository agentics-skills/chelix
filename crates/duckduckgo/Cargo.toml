[package]
description          = "DuckDuckGo web search tool for Chelix"
edition.workspace    = true
name                 = "chelix-duckduckgo"
repository.workspace = true
version.workspace    = true

[dependencies]
anyhow         = { workspace = true }
async-trait    = { workspace = true }
chelix-agents  = { workspace = true }
chelix-common  = { workspace = true }
chelix-config  = { workspace = true }
chelix-metrics = { optional = true, workspace = true }
regex          = { workspace = true }
reqwest        = { features = ["brotli", "cookies", "deflate", "gzip"], workspace = true }
serde          = { workspace = true }
serde_json     = { workspace = true }
thiserror      = { workspace = true }
tokio          = { workspace = true }
tracing        = { workspace = true }
url            = { workspace = true }
urlencoding    = { workspace = true }

[dev-dependencies]
mockito = { workspace = true }
tokio   = { features = ["macros", "rt-multi-thread", "test-util"], workspace = true }

[features]
default = ["tracing"]
metrics = ["dep:chelix-metrics"]
tracing = []

[lints]
workspace = true
