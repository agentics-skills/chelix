[package]
description          = "DuckDuckGo web search tool for Chelix"
edition.workspace    = true
name                 = "chelix-duckduckgo"
repository.workspace = true
version.workspace    = true

[dependencies]
anyhow         = { optional = true, workspace = true }
async-trait    = { optional = true, workspace = true }
chelix-agents  = { optional = true, workspace = true }
chelix-common  = { optional = true, workspace = true }
chelix-config  = { workspace = true }
chelix-metrics = { optional = true, workspace = true }
regex          = { optional = true, workspace = true }
reqwest        = { features = ["brotli", "cookies", "deflate", "gzip"], optional = true, workspace = true }
serde          = { optional = true, workspace = true }
serde_json     = { optional = true, workspace = true }
thiserror      = { optional = true, workspace = true }
tokio          = { optional = true, workspace = true }
tracing        = { optional = true, workspace = true }
url            = { optional = true, workspace = true }
urlencoding    = { optional = true, workspace = true }

[dev-dependencies]
mockito = { workspace = true }
tokio   = { features = ["macros", "rt-multi-thread", "test-util"], workspace = true }

[features]
default = ["runtime", "tracing"]
metrics = ["dep:chelix-metrics"]
runtime = [
  "dep:anyhow",
  "dep:async-trait",
  "dep:chelix-agents",
  "dep:chelix-common",
  "dep:regex",
  "dep:reqwest",
  "dep:serde",
  "dep:serde_json",
  "dep:thiserror",
  "dep:tokio",
  "dep:tracing",
  "dep:url",
  "dep:urlencoding",
]
tracing = []

[lints]
workspace = true
